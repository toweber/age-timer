<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alters-Timer</title>

  <style>
    :root {
      --bg1: #f8fafc;
      --bg2: #e2e8f0;
      --card: rgba(255, 255, 255, 0.92);
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --box: #ffffff;
      --primary: #2563eb;
    }

    body.dark {
      --bg1: #020617;
      --bg2: #111827;
      --card: rgba(15, 23, 42, 0.92);
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
      --box: #0f172a;
      --primary: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    .header {
      position: relative;
      text-align: center;
      padding-top: 30px;
      padding-bottom: 30px;
    }

    .theme-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--box);
      color: var(--text);
      font-size: 0.95rem;
      cursor: pointer;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
    }

    .main-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .time-box {
      background: var(--box);
      border-radius: 18px;
      padding: 18px 12px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .value {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .label {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .secondary-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .secondary-card .big {
      font-size: 2rem;
      font-weight: 800;
    }

    .secondary-card .text {
      color: var(--muted);
      font-size: 1rem;
    }

    .settings-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
    }

    .options {
      display: none;
      flex-direction: column;
      gap: 14px;
      position: fixed;
      left: 50%;
      bottom: 95px;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 500px;
    }

    .options.visible {
      display: flex;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--box);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      color-scheme: light;
    }

    body.dark input {
      color-scheme: dark;
    }

    button.action {
      border: none;
      background: var(--primary);
      color: white;
      padding: 14px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 8px;
    }

    /* ── First-run overlay ── */
    #setupOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #setupOverlay.visible {
      display: flex;
    }

    #setupBox {
      background: var(--card);
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    #setupBox h2 {
      font-size: 1.5rem;
      font-weight: 800;
      text-align: center;
    }

    #setupBox p {
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
      margin-top: -6px;
    }
  </style>
</head>

<body>

  <!-- First-run setup overlay -->
  <div id="setupOverlay">
    <div id="setupBox" class="card">
      <h2>👤 Willkommen!</h2>
      <p>Gib den Namen und Geburtstag der Person ein. Diese Daten werden lokal gespeichert.</p>
      <input type="text" id="setupName" placeholder="Name" />
      <input type="datetime-local" id="setupBirthdate" />
      <button class="action" onclick="saveSetup()">Speichern & starten</button>
    </div>
  </div>

  <div class="container">

    <div class="card header">
      <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">🌙</button>
      <h1 id="personName">…</h1>
      <div class="subtitle" id="birthInfo"></div>
    </div>

    <div class="card">
      <div class="main-grid">
        <div class="time-box">
          <div class="value" id="years">0</div>
          <div class="label">Jahre</div>
        </div>
        <div class="time-box">
          <div class="value" id="months">0</div>
          <div class="label">Monate</div>
        </div>
        <div class="time-box">
          <div class="value" id="days">0</div>
          <div class="label">Tage</div>
        </div>
        <div class="time-box">
          <div class="value" id="hours">0</div>
          <div class="label">Stunden</div>
        </div>
        <div class="time-box">
          <div class="value" id="minutes">0</div>
          <div class="label">Minuten</div>
        </div>
        <div class="time-box">
          <div class="value" id="seconds">0</div>
          <div class="label">Sekunden</div>
        </div>
      </div>
    </div>

    <div class="card secondary-card">
      <div class="text">Gesamt in Monaten</div>
      <div class="big" id="totalMonths">0</div>
    </div>

    <div class="card secondary-card">
      <div class="text">Gesamt in Wochen</div>
      <div class="big" id="totalWeeks">0</div>
    </div>

    <div class="card secondary-card">
      <div class="text">Gesamt in Tagen</div>
      <div class="big" id="totalDays">0</div>
    </div>

  </div>

  <button class="settings-button" onclick="toggleOptions()">⚙️</button>

  <div class="card options" id="optionsMenu">
    <h2>Daten ändern</h2>
    <input type="text" id="customName" placeholder="Name" />
    <input type="datetime-local" id="customBirthdate" />
    <button class="action" onclick="applyCustomData()">Speichern</button>
    <div class="footer-note">
      Die Änderungen werden dauerhaft gespeichert.
    </div>
  </div>

  <script>
    const STORAGE_KEY_NAME      = "timer_name";
    const STORAGE_KEY_BIRTHDATE = "timer_birthdate";

    let currentName      = "";
    let currentBirthdate = null;

    // ── Theme ──
    function applyTheme(isDark) {
      document.body.classList.toggle("dark", isDark);
      document.getElementById("themeToggleBtn").textContent = isDark ? "☀️" : "🌙";
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      document.getElementById("themeToggleBtn").textContent = isDark ? "☀️" : "🌙";
    }

    applyTheme(localStorage.getItem("theme") === "dark");

    // ── Storage helpers ──
    function loadFromStorage() {
      const name      = localStorage.getItem(STORAGE_KEY_NAME);
      const birthdate = localStorage.getItem(STORAGE_KEY_BIRTHDATE);
      if (name && birthdate) {
        currentName      = name;
        currentBirthdate = new Date(birthdate);
        return true;
      }
      return false;
    }

    function saveToStorage(name, birthdateISO) {
      localStorage.setItem(STORAGE_KEY_NAME,      name);
      localStorage.setItem(STORAGE_KEY_BIRTHDATE, birthdateISO);
    }

    // ── First-run setup ──
    function showSetup() {
      document.getElementById("setupOverlay").classList.add("visible");
    }

    function saveSetup() {
      const name      = document.getElementById("setupName").value.trim();
      const birthdate = document.getElementById("setupBirthdate").value;

      if (!name || !birthdate) {
        alert("Bitte Namen und Geburtstag eingeben.");
        return;
      }

      saveToStorage(name, new Date(birthdate).toISOString());
      currentName      = name;
      currentBirthdate = new Date(birthdate);

      document.getElementById("setupOverlay").classList.remove("visible");
      updateUI();
    }

    // ── Age calculation ──
    function daysInMonth(year, month) {
      return new Date(year, month + 1, 0).getDate();
    }

    function calculateDetailedAge(birthDate, now) {
      let years  = now.getFullYear() - birthDate.getFullYear();
      let months = now.getMonth()    - birthDate.getMonth();

      const anchorDay = Math.min(birthDate.getDate(), daysInMonth(now.getFullYear(), now.getMonth()));

      let days    = now.getDate()    - anchorDay;
      let hours   = now.getHours()   - birthDate.getHours();
      let minutes = now.getMinutes() - birthDate.getMinutes();
      let seconds = now.getSeconds() - birthDate.getSeconds();

      if (seconds < 0) { seconds += 60; minutes--; }
      if (minutes < 0) { minutes += 60; hours--; }
      if (hours   < 0) { hours   += 24; days--; }

      if (days < 0) {
        const previousMonth     = (now.getMonth() - 1 + 12) % 12;
        const previousMonthYear = previousMonth === 11 ? now.getFullYear() - 1 : now.getFullYear();
        days += daysInMonth(previousMonthYear, previousMonth);
        months--;
      }

      if (months < 0) { months += 12; years--; }

      return { years, months, days, hours, minutes, seconds };
    }

    function updateUI() {
      if (!currentBirthdate) return;

      const now = new Date();
      const age = calculateDetailedAge(currentBirthdate, now);

      document.getElementById("personName").textContent = currentName;
      document.getElementById("birthInfo").textContent =
      `Geboren am ${currentBirthdate.toLocaleDateString("de-DE")} um ${currentBirthdate.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })} Uhr`;

      document.getElementById("years").textContent   = age.years;
      document.getElementById("months").textContent  = age.months;
      document.getElementById("days").textContent    = age.days;
      document.getElementById("hours").textContent   = age.hours;
      document.getElementById("minutes").textContent = age.minutes;
      document.getElementById("seconds").textContent = age.seconds;

      const diffMs     = now - currentBirthdate;
      const totalDays  = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const totalWeeks = Math.floor(totalDays / 7);
      const totalMonths = age.years * 12 + age.months;

      document.getElementById("totalMonths").textContent = totalMonths;
      document.getElementById("totalWeeks").textContent  = totalWeeks;
      document.getElementById("totalDays").textContent   = totalDays;
    }

    // ── Settings panel ──
    function toggleOptions() {
      const menu = document.getElementById("optionsMenu");
      const isOpening = !menu.classList.contains("visible");

      if (isOpening) {
        // Pre-fill with current values
        document.getElementById("customName").value = currentName;
        if (currentBirthdate) {
          // datetime-local needs format "YYYY-MM-DDTHH:MM"
          const pad = n => String(n).padStart(2, "0");
          const d   = currentBirthdate;
          document.getElementById("customBirthdate").value =
            `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }
      }

      menu.classList.toggle("visible");
    }

    function applyCustomData() {
      const name      = document.getElementById("customName").value.trim();
      const birthdate = document.getElementById("customBirthdate").value;

      if (!name || !birthdate) {
        alert("Bitte Namen und Geburtstag eingeben.");
        return;
      }

      currentName      = name;
      currentBirthdate = new Date(birthdate);

      saveToStorage(name, currentBirthdate.toISOString());

      updateUI();
      toggleOptions();
    }

    // ── Init ──
    if (loadFromStorage()) {
      updateUI();
    } else {
      showSetup();
    }

    setInterval(updateUI, 1000);
  </script>
</body>
</html>
